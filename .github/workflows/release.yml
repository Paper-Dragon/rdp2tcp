name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-client:
    name: Build Client (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Build client
        run: make client

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: rdp2tcp-client-linux
          path: client/rdp2tcp

      - name: Prepare tools for release
        run: |
          cp -r tools/ release-tools
          rm release-tools/Makefile

      - name: Upload tools artifact
        uses: actions/upload-artifact@v5
        with:
          name: tools
          path: release-tools

  build-server:
    name: Build Server (Cross-compile on Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install MinGW cross-compiler
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Clean for mingw32 build
        run: make clean

      - name: Build server (mingw32)
        run: make server-mingw32

      - name: Upload mingw32 artifact
        uses: actions/upload-artifact@v5
        with:
          name: rdp2tcp-server-win32
          path: server/rdp2tcp-win32.exe

      - name: Clean for mingw64 build
        run: make clean

      - name: Build server (mingw64)
        run: make server-mingw64

      - name: Upload mingw64 artifact
        uses: actions/upload-artifact@v5
        with:
          name: rdp2tcp-server-win64
          path: server/rdp2tcp-win64.exe

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-client, build-server]
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package artifacts into a zip file
        run: |
          cd artifacts
          zip -r ../rdp2tcp.zip .
          cd ..

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: rdp2tcp.zip